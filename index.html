<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Mohamad Chleih</title>
    <meta name="description" content="Mohamad Chleih" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="dist/css/main.css" />
  </head>
  <body>
    <!-- Loading screen on initial visit -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loader"></div>
    </div>
    <!-- Full page canvas -->
    <div class="content-wrapper content-hidden">
      <!-- Header container -->
      <div class="header-row">
        <!-- Container for the dark and light mode -->
        <div class="top-row-container">
          <div class="theme_colors">
            <div class="theme_btn" id="light_mode_btn">
              <i class="bi bi-square"></i>
              <i class="bi bi-square-fill" style="display: none"></i>
              <div class="_text">Light</div>
            </div>
            <div class="theme_btn" id="dark_mode_btn">
              <i class="bi bi-square-fill"></i>
              <i class="bi bi-square" style="display: none"></i>
              <div class="_text">Dark</div>
            </div>
          </div>
          <p class="based_in"></p>
        </div>
      </div>
      <!-- Box container -->
      <div class="custom-container">
        <!-- Header container -->
        <div class="header-container">
          <header>
            <!-- Logo section -->
            <div class="brand">
              <span class="brand_name brand_hover">MohamadChleih</span><span class="brand_dot brand_hover">.</span
              ><span class="brand_underscore brand_hover">_</span>
            </div>
            <nav>
              <!-- Navigation Menu -->
              <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contact</a></li>
              </ul>
            </nav>
          </header>
        </div>

        <!-- Greeting center content container -->
        <div class="center-content">
          <div class="greeting-container">
            <div class="custom-tag">Mohamad Chleih</div>
            <div class="custom-statement">Translating abstract ideas into concrete software realities</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer-row-container">
        <!-- Container for the copyright text -->
        <div class="left-footer-container">
          <p class="copyright">&copy; 2024 All rights reserved.</p>
        </div>

        <!-- Container for the based text -->
        <div class="center-footer-container">
          <p class="based_in">Based in Copenhagen, Denmark.</p>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.7.4/lottie.min.js"></script>
    <script src="dist/js/index.js" defer></script>
  </body>
</html>
