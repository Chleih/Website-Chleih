<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title data-i18n="common:meta.title">Mohamad Chleih | Portfolio</title>
        <meta
            name="description"
            content="Portfolio website of Mohamad Chleih, focused on software development, technical consulting, and building maintainable digital solutions."
            data-i18n-attr="content=common:meta.description"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    </head>

    <body>
        <!-- Loading screen on initial visit -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loader"></div>
        </div>

        <!-- Full page canvas -->
        <div class="content-wrapper-container content-hidden">
            <!-- Container for the language and theme controls -->
            <div class="top-row-container">
                <div class="top-row-controls">
                    <div
                        class="control-group language-controls"
                        role="group"
                        aria-label="Language"
                        data-i18n-attr="aria-label=common:language.label"
                    >
                        <button
                            class="control-btn language-btn"
                            id="language-da-btn"
                            type="button"
                            data-language-option
                            data-language="da"
                            aria-pressed="false"
                            data-active="false"
                            data-i18n-attr="aria-label=common:language.switchToDanish; title=common:language.switchToDanish"
                        >
                            <span>DA</span>
                        </button>

                        <button
                            class="control-btn language-btn"
                            id="language-en-btn"
                            type="button"
                            data-language-option
                            data-language="en"
                            aria-pressed="false"
                            data-active="false"
                            data-i18n-attr="aria-label=common:language.switchToEnglish; title=common:language.switchToEnglish"
                        >
                            <span>EN</span>
                        </button>
                    </div>

                    <div
                        class="control-group theme-controls"
                        role="group"
                        aria-label="Theme"
                        data-i18n-attr="aria-label=common:theme.label"
                    >
                        <button
                            class="control-btn theme-btn"
                            id="light-mode-btn"
                            type="button"
                            data-theme-target="light"
                            aria-pressed="false"
                            data-active="false"
                            data-i18n-attr="aria-label=common:theme.switchToLight; title=common:theme.switchToLight"
                        >
                            <i class="bi bi-square" aria-hidden="true"></i>
                            <i class="bi bi-square-fill" aria-hidden="true" style="display: none"></i>
                            <span data-i18n="common:theme.light">Light</span>
                        </button>

                        <button
                            class="control-btn theme-btn"
                            id="dark-mode-btn"
                            type="button"
                            data-theme-target="dark"
                            aria-pressed="false"
                            data-active="false"
                            data-i18n-attr="aria-label=common:theme.switchToDark; title=common:theme.switchToDark"
                        >
                            <i class="bi bi-square" aria-hidden="true"></i>
                            <i class="bi bi-square-fill" aria-hidden="true" style="display: none"></i>
                            <span data-i18n="common:theme.dark">Dark</span>
                        </button>
                    </div>
                </div>

                <p class="right-corner-content"></p>
            </div>

            <!-- Box container -->
            <div class="central-box-container">
                <!-- Header container -->
                <div class="box-header-container">
                    <header>
                        <!-- Logo section -->
                        <div class="brand">
                            <span class="brand-name brand-hover">mohamadChleih</span>
                            <span class="brand-dot brand-hover">.</span>
                            <span class="brand-underscore brand-hover">_</span>
                        </div>

                        <!-- Navigation Menu -->
                        <nav>
                            <ul>
                                <li><a href="#" data-i18n="header:nav.about">About</a></li>
                                <li><a href="#" data-i18n="header:nav.portfolio">Portfolio</a></li>
                                <li><a href="#" data-i18n="header:nav.blog">Blog</a></li>
                                <li><a href="#" data-i18n="header:nav.contact">Contact</a></li>
                            </ul>
                        </nav>
                    </header>
                </div>

                <!-- Greeting center content container -->
                <div class="box-center-container">
                    <div class="greeting-container">
                        <div class="custom-tag" data-i18n="home:hero.name">Mohamad Chleih</div>
                        <div class="custom-statement" data-i18n="home:hero.tagline">
                            Translating abstract ideas into concrete software realities
                        </div>
                    </div>
                </div>

                <div id="particle-container"></div>
            </div>

            <!-- Footer -->
            <div class="bottom-row-container">
                <!-- Container for the copyright text -->
                <p class="footer-corner-content footer-corner-content--left" data-i18n="footer:copyright">
                    &copy; 2026 All rights reserved.
                </p>

                <!-- Container for the based text -->
                <p class="footer-corner-content footer-corner-content--right" data-i18n="footer:location">
                    Based in Copenhagen, Denmark.
                </p>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
            defer
        ></script>
        <script type="module" src="src/js/index.js"></script>
    </body>
</html>
