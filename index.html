<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Mohamad Chleih</title>
        <meta name="description" content="Mohamad Chleih" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="docs/css/main.css" />
    </head>
    <body>
        <!-- Loading screen on initial visit -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loader"></div>
        </div>

        <!-- Full page canvas -->
        <div class="content-wrapper-container content-hidden">
            <!-- Container for the dark and light mode -->
            <div class="top-row-container">
                <div class="theme-colors">
                    <div class="theme-btn" id="light-mode-btn">
                        <i class="bi bi-square"></i>
                        <i class="bi bi-square-fill" style="display: none"></i>
                        <div>Light</div>
                    </div>
                    <div class="theme-btn" id="dark-mode-btn">
                        <i class="bi bi-square-fill"></i>
                        <i class="bi bi-square" style="display: none"></i>
                        <div>Dark</div>
                    </div>
                </div>
                <p class="right-corner-content"></p>
            </div>

            <!-- Box container -->
            <div class="central-box-container">
                <!-- Header container -->
                <div class="box-header-container">
                    <header>
                        <!-- Logo section -->
                        <div class="brand">
                            <span class="brand-name brand-hover"
                                >mohamadChleih</span
                            ><span class="brand-dot brand-hover">.</span
                            ><span class="brand-underscore brand-hover">_</span>
                        </div>

                        <!-- Navigation Menu -->
                        <nav>
                            <ul>
                                <li><a href="#">About</a></li>
                                <li><a href="#">Portfolio</a></li>
                                <li><a href="#">Blog</a></li>
                                <li><a href="#">Contact</a></li>
                            </ul>
                        </nav>
                    </header>
                </div>

                <!-- Greeting center content container -->
                <div class="box-center-container">
                    <div class="greeting-container">
                        <div class="custom-tag">Mohamad Chleih</div>
                        <div class="custom-statement">
                            Translating abstract ideas into concrete software
                            realities
                        </div>
                    </div>
                </div>
                <div id="particle-container"></div>
            </div>

            <!-- Footer -->
            <div class="bottom-row-container">
                <!-- Container for the copyright text -->
                <p class="left-corner-content">
                    &copy; 2026 All rights reserved.
                </p>

                <!-- Container for the based text -->
                <p class="right-corner-content">
                    Based in Copenhagen, Denmark.
                </p>
            </div>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
            defer
        ></script>
        <script src="src/js/index.js" defer></script>
    </body>
</html>
